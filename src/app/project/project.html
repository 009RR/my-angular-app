<div class="projects-container">
    @for (project of projects; track project.id) {
        <div class="project">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
            <span>
                @if (project.status === 'Completed') {
                    Completed
                } @else {
                    In Progress
                }
            </span>
        </div>
    } @empty {
        <p>No projects available.</p>
    }
</div>
